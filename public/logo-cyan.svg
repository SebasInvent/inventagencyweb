<svg width="200" height="280" viewBox="0 0 200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Triangle (A shape) -->
  <path d="M100 10 L190 170 L10 170 Z" stroke="#00D4FF" stroke-width="8" fill="none" stroke-linejoin="round"/>
  
  <!-- Inner Triangle cutout -->
  <path d="M100 55 L150 145 L50 145 Z" stroke="#00D4FF" stroke-width="6" fill="none" stroke-linejoin="round"/>
  
  <!-- Vertical line (I) on the left -->
  <line x1="35" y1="25" x2="75" y2="105" stroke="#00D4FF" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Text: invent -->
  <text x="100" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="400" fill="#00D4FF" text-anchor="middle" letter-spacing="2">invent</text>
  
  <!-- Text: agency -->
  <text x="100" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="300" fill="#00D4FF" text-anchor="middle" letter-spacing="4">agency</text>
</svg>
